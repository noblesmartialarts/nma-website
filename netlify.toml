[build]
  publish = "."
  functions = "netlify/functions"

# Netlify Forms enabled site-wide for the "workshop-inquiry" form
# on /group-workshops (submits to /thank-you). Set up email
# notifications for new submissions under Site settings > Forms.

# --- Legacy pages from the old site, still showing up in Google search ---
# 301s so search engines update their index to point at current content
# instead of a dead page.
[[redirects]]
  from = "/little-dragons-1"
  to = "/classes"
  status = 301

[[redirects]]
  from = "/karate-kids"
  to = "/classes"
  status = 301

[[redirects]]
  from = "/black-belt-club-1"
  to = "/classes"
  status = 301

[[redirects]]
  from = "/masters-club"
  to = "/classes"
  status = 301

[[redirects]]
  from = "/masters-club-1"
  to = "/classes"
  status = 301

[[redirects]]
  from = "/submit-a-review"
  to = "/"
  status = 301

# Catches all old blog posts under /f/*, not just the ones currently
# showing up in search results, in case others surface later.
[[redirects]]
  from = "/f/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/registration"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/practice-videos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/parent-hub"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sale"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/lost-and-found"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/forms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/classes"
  to = "/index.html"
  status = 200

# --- Branded short link for the parent photo-sharing Jotform ---
[[redirects]]
  from = "/photos"
  to = "https://form.jotform.com/262372828972065"
  status = 301
  force = true

[functions."pl-notify-approved"]
  schedule = "*/5 * * * *"

[functions."sale-notify-approved"]
  schedule = "*/5 * * * *"
